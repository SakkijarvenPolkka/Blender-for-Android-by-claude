name: Build Android APK

on:
  push:
    branches: [main, "claude/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A build takes hours and continues from the caches of the previous one: a new push waits for
  # the running build instead of cancelling it (only the latest waiting build is kept).
  cancel-in-progress: false

# Successful builds of the default branch & tags `v*` are published as GitHub releases (APK and
# optional components), linked from the README.
#
# The work is split in stages that each fit in a job (6 hours on GitHub-hosted runners) and
# continue from the caches of the previous stage. Later stages are skipped when there's nothing
# left to do (e.g. dependencies found in the cache).
jobs:
  deps-1:
    uses: ./.github/workflows/deps.yml
    with:
      stage: 1

  deps-2:
    needs: deps-1
    if: needs.deps-1.outputs.complete != 'true'
    uses: ./.github/workflows/deps.yml
    with:
      stage: 2
      last-stage: true

  blender-1:
    needs: [deps-1, deps-2]
    if: >-
      !cancelled() && needs.deps-1.result == 'success' &&
      (needs.deps-1.outputs.complete == 'true' || needs.deps-2.outputs.complete == 'true')
    permissions:
      contents: write
    uses: ./.github/workflows/blender.yml
    # Signing key of the APK (optional).
    secrets: inherit
    with:
      stage: 1
      deps-cache-key: ${{ needs.deps-1.outputs.cache-key }}
      publish: ${{ github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/v') || github.ref_name == github.event.repository.default_branch) }}

  blender-2:
    needs: [deps-1, blender-1]
    if: needs.blender-1.result == 'success' && needs.blender-1.outputs.complete != 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/blender.yml
    secrets: inherit
    with:
      stage: 2
      deps-cache-key: ${{ needs.deps-1.outputs.cache-key }}
      last-stage: true
      publish: ${{ github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/v') || github.ref_name == github.event.repository.default_branch) }}

  # Optional components (USD's Python modules), linked against the `libblender.so` of the APK.
  components:
    needs: [deps-1, blender-1, blender-2]
    if: >-
      !cancelled() &&
      (needs.blender-1.outputs.complete == 'true' || needs.blender-2.outputs.complete == 'true')
    permissions:
      contents: write
    uses: ./.github/workflows/components.yml
    with:
      deps-cache-key: ${{ needs.deps-1.outputs.cache-key }}
      publish: ${{ github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/v') || github.ref_name == github.event.repository.default_branch) }}
