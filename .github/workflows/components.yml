# Builds the optional components (installed after the application from Blender, `Edit > Android
# Components`) against the `libblender.so` of the APK, called by `build-apk.yml`. On tags `v*` they
# are attached to the release, where the application downloads them from.

name: Components

on:
  workflow_call:
    inputs:
      deps-cache-key:
        type: string
        required: true

jobs:
  components:
    name: Optional components
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    permissions:
      contents: write
    env:
      WORK_DIR: ${{ github.workspace }}/_work
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk /opt/ghc /usr/local/share/boost \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/lib/node_modules || true

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build patch zip unzip

      - name: Restore dependencies
        uses: actions/cache/restore@v4
        with:
          path: |
            _work/android_arm64_libs
            _work/host_python
            _work/downloads
          key: ${{ inputs.deps-cache-key }}
          fail-on-cache-miss: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android NDK
        run: |
          export ANDROID_HOME="${ANDROID_SDK_ROOT}"
          echo "ANDROID_HOME=${ANDROID_HOME}" >> "${GITHUB_ENV}"
          ./scripts/setup_sdk.sh

      - name: Blender source
        run: ./scripts/fetch_blender.sh

      - uses: actions/download-artifact@v4
        with:
          name: blender-android-components-input
          path: _work/components-input

      - name: Components
        run: |
          source scripts/env.sh
          mkdir -p "${BLENDER_BUILD_DIR}/lib" "${BLENDER_INSTALL_DIR}/${BLENDER_VERSION_SHORT}/datafiles/android"
          mv _work/components-input/libblender.so "${BLENDER_BUILD_DIR}/lib/"
          mv _work/components-input/build_info.json \
            "${BLENDER_INSTALL_DIR}/${BLENDER_VERSION_SHORT}/datafiles/android/"
          ./scripts/build_components.sh

      - uses: actions/upload-artifact@v4
        with:
          name: blender-android-components
          path: _work/out/components
          if-no-files-found: error

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            _work/out/components/*.zip
            _work/out/components/components.json
