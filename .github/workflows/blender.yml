# Builds Blender, runs the QEMU tests and packages the APK, called by `build-apk.yml`.
#
# Without a compiler cache, compiling Blender may not fit in one job: the build stops in time to
# save the cache (ccache) and the next stage continues from there.

name: Blender

on:
  workflow_call:
    inputs:
      stage:
        type: number
        required: true
      deps-cache-key:
        type: string
        required: true
      last-stage:
        description: Fail when the build is still incomplete after this stage
        type: boolean
        default: false
      publish:
        description: Publish the APK as a GitHub release (see `build-apk.yml`)
        type: boolean
        default: false
    secrets:
      # Release signing key (optional), see README: without it the APK is signed with the debug
      # key of the build machine, which changes with each build.
      BLENDER_ANDROID_KEYSTORE_BASE64:
        required: false
      BLENDER_ANDROID_KEYSTORE_PASSWORD:
        required: false
      BLENDER_ANDROID_KEY_ALIAS:
        required: false
      BLENDER_ANDROID_KEY_PASSWORD:
        required: false
    outputs:
      complete:
        description: "'true' when the APK was built"
        value: ${{ jobs.blender.outputs.complete }}

jobs:
  blender:
    name: Blender & APK (stage ${{ inputs.stage }})
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    permissions:
      contents: write
    outputs:
      complete: ${{ steps.result.outputs.complete }}
    env:
      WORK_DIR: ${{ github.workspace }}/_work
      CCACHE_DIR: ${{ github.workspace }}/_work/ccache
      CCACHE_MAXSIZE: 3G
      CCACHE_COMPRESS: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk /opt/ghc /usr/local/share/boost \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/lib/node_modules || true
          df -h "${GITHUB_WORKSPACE}"

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build qemu-user-static ccache autoconf automake libtool pkg-config \
            patch zip unzip e2fsprogs libssl-dev zlib1g-dev libffi-dev

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Restore dependencies
        uses: actions/cache/restore@v4
        with:
          path: |
            _work/android_arm64_libs
            _work/host_python
            _work/downloads
          key: ${{ inputs.deps-cache-key }}
          fail-on-cache-miss: true

      - name: Restore compiler cache
        uses: actions/cache/restore@v4
        with:
          path: _work/ccache
          key: ccache-${{ runner.os }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.stage }}
          restore-keys: ccache-${{ runner.os }}-

      - name: Android SDK & NDK
        run: |
          export ANDROID_HOME="${ANDROID_SDK_ROOT}"
          echo "ANDROID_HOME=${ANDROID_HOME}" >> "${GITHUB_ENV}"
          ./scripts/setup_sdk.sh

      - name: Blender source
        run: ./scripts/fetch_blender.sh

      - name: Dependencies
        # Only checks that the cached dependencies are up to date.
        run: ./scripts/build_deps.sh

      # Release of this build (the application downloads its optional components from it): the
      # tag `v*` that was pushed, or one per published build of the default branch.
      - name: Release tag
        run: |
          source scripts/env.sh
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            RELEASE_TAG="${GITHUB_REF_NAME}"
          elif [ "${{ inputs.publish }}" = "true" ]; then
            RELEASE_TAG="v${BLENDER_VERSION}-android.${PORT_REVISION}-build.${GITHUB_RUN_NUMBER}"
          fi
          echo "RELEASE_TAG=${RELEASE_TAG}" >> "${GITHUB_ENV}"
          echo "Release: ${RELEASE_TAG}"

      - name: Blender
        id: build
        env:
          # Leaves time to save the compiler cache.
          BLENDER_TIME_LIMIT: 300m
        run: |
          status=0
          ./scripts/build_blender.sh || status=$?
          ccache --show-stats || true
          echo "status=${status}" >> "${GITHUB_OUTPUT}"

      - name: Save compiler cache
        if: steps.build.outputs.status != ''
        uses: actions/cache/save@v4
        with:
          path: _work/ccache
          key: ccache-${{ runner.os }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.stage }}

      # Runs the Android build in background mode with QEMU user-mode emulation and Android's
      # bionic libraries: Python, modeling, file I/O, rendering, video and the MCP server.
      - name: Smoke test (QEMU)
        if: steps.build.outputs.status == '0'
        run: ./tests/qemu/run_blender.sh

      - name: APK
        if: steps.build.outputs.status == '0'
        env:
          KEYSTORE_BASE64: ${{ secrets.BLENDER_ANDROID_KEYSTORE_BASE64 }}
          BLENDER_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.BLENDER_ANDROID_KEYSTORE_PASSWORD }}
          BLENDER_ANDROID_KEY_ALIAS: ${{ secrets.BLENDER_ANDROID_KEY_ALIAS }}
          BLENDER_ANDROID_KEY_PASSWORD: ${{ secrets.BLENDER_ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "${KEYSTORE_BASE64}" ]; then
            echo "${KEYSTORE_BASE64}" | base64 -d > "${RUNNER_TEMP}/release.keystore"
            export BLENDER_ANDROID_KEYSTORE="${RUNNER_TEMP}/release.keystore"
            echo "Signing with the release key"
          else
            echo "::warning::No release key (BLENDER_ANDROID_KEYSTORE_BASE64), signing with a debug key"
          fi
          ./scripts/package_apk.sh
          rm -f "${RUNNER_TEMP}/release.keystore"

      - uses: actions/upload-artifact@v4
        if: steps.build.outputs.status == '0'
        with:
          name: blender-android-arm64-apk
          path: _work/out/*.apk
          if-no-files-found: error

      # The optional components (`components.yml`) are linked against this `libblender.so`.
      - name: Files for the components
        if: steps.build.outputs.status == '0'
        run: |
          source scripts/env.sh
          mkdir -p _work/components-input
          "${ANDROID_TOOLCHAIN_DIR}/bin/llvm-strip" -o _work/components-input/libblender.so \
            "${BLENDER_BUILD_DIR}/lib/libblender.so"
          cp "${BLENDER_INSTALL_DIR}/${BLENDER_VERSION_SHORT}/datafiles/android/build_info.json" \
            _work/components-input/

      - uses: actions/upload-artifact@v4
        if: steps.build.outputs.status == '0'
        with:
          name: blender-android-components-input
          path: _work/components-input
          retention-days: 3
          if-no-files-found: error

      - name: Release notes
        if: steps.build.outputs.status == '0' && inputs.publish
        run: |
          source scripts/env.sh
          apk="Blender-${BLENDER_VERSION}-android-${ANDROID_ABI}.apk"
          cat > _work/release_notes.md <<EOF
          Blender ${BLENDER_VERSION} for Android (arm64-v8a), build of ${GITHUB_SHA::12}.

          **Install:** download \`${apk}\` on the phone (Android 12+, Galaxy S22 or newer, recommended:
          Galaxy Z Fold 8 Ultra) and open it, or \`adb install -r ${apk}\`. See the
          [README](https://github.com/${GITHUB_REPOSITORY}#readme) for details.

          **Optional components** (USD Python modules \`pxr\`, pip packages) are installed from Blender:
          *Edit > Android Components*. The files of this release (\`components.json\`, \`*.zip\`) are
          made for this APK.

          Made purely with Claude Opus 5.5 (Claude Code).

          ---

          **설치:** 휴대폰에서 \`${apk}\`를 받아 열거나 \`adb install -r ${apk}\` (Android 12 이상,
          Galaxy S22 이상, 권장: Galaxy Z Fold 8 Ultra). **추가 구성 요소**(USD Python 모듈, pip 패키지)는
          Blender의 *편집 > Android Components*에서 이 릴리스의 파일로 설치합니다.
          이 프로젝트는 순수하게 Claude Opus 5.5만을 활용해 만든 프로젝트입니다.
          EOF

      - name: Release
        if: steps.build.outputs.status == '0' && inputs.publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: ${{ env.RELEASE_TAG }}
          body_path: _work/release_notes.md
          files: _work/out/*.apk
          make_latest: "true"

      - name: Result
        id: result
        run: |
          case "${{ steps.build.outputs.status }}" in
            0)
              echo "complete=true" >> "${GITHUB_OUTPUT}" ;;
            124)
              echo "complete=false" >> "${GITHUB_OUTPUT}"
              if [ "${{ inputs.last-stage }}" = "true" ]; then
                echo "::error::Build incomplete, run the workflow again to continue (with ccache)"
                exit 1
              fi
              echo "::notice::Time limit reached, the next stage continues the build" ;;
            *)
              echo "::error::Building Blender failed (see the Blender step)"
              exit 1 ;;
          esac
